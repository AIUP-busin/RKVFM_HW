<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Shaxsiy va Byudjet Rejasi</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f8f9fa; }
        .action-btn { background-color: #007bff; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
        .action-btn:hover { background-color: #0056b3; }
        .highlight { background-color: #fff3cd; }
    </style>
</head>
<body>

<h2>1 Oylik Shaxsiy va Byudjet Rejasi</h2>
<table id="myTable">
    <thead>
        <tr>
            <th>Kun</th>
            <th>Ishlar</th>
            <th>Byudjet</th>
            <th>Natijalar</th>
            <th>Boshqaruv</th>
        </tr>
    </thead>
    <tbody>
        <tr id="row1"><td>12-Iyun</td><td>Reja tuzish</td><td>0</td><td>Bajarildi</td><td><button class="action-btn" onclick="tahrirlash('row1')">Tahrirlash</button></td></tr>
        <tr id="row2"><td>13-Iyun</td><td>O'quv vazifalari</td><td>-500k</td><td>Jarayonda</td><td><button class="action-btn" onclick="tahrirlash('row2')">Tahrirlash</button></td></tr>
    </tbody>
</table>

<script>
    function tahrirlash(rowId) {
        const row = document.getElementById(rowId);
        row.classList.add('highlight');
        alert("Siz: 'Shu kunni bo'shat va vazifani keyingi haftaga sur' deb buyruq berdingiz.");
        // Bu yerda backend yoki Google Sheets API bilan bog'lash mumkin
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Target International School | Strategic Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .wrapper { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { border-bottom: 3px solid #0056b3; margin-bottom: 20px; padding-bottom: 10px; color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #0056b3; color: white; padding: 12px; text-align: left; }
        td { border: 1px solid #ddd; padding: 12px; }
        .move-btn { background: #e67e22; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .status-on { background-color: #fff3cd; }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 8px; flex: 1; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>Target International School</h1>
        <p>1 Oylik Strategik Reja va Byudjet Monitoringi</p>
    </div>
    
    <div class="stats-bar">
        <div class="card">Jami byudjet: 50,000,000 UZS</div>
        <div class="card">Bajarilgan vazifalar: 12</div>
        <div class="card">Status: Faol</div>
    </div>

    <table>
        <tr><th>Kun</th><th>Akademik/Byudjet Vazifasi</th><th>Byudjet (UZS)</th><th>Natija</th><th>Amal</th></tr>
        <tr id="row1">
            <td>12-Iyun</td>
            <td>Target o'quv dasturi tahlili</td>
            <td>0</td>
            <td>Rejalashtirilgan</td>
            <td><button class="move-btn" onclick="tahrirlash('row1')">Surish</button></td>
        </tr>
    </table>
</div>
<script>
    function tahrirlash(id) {
        document.getElementById(id).classList.add('status-on');
        alert("Tizim xabari: Vazifa keyingi haftaga surildi va investorlar bazasi yangilandi.");
    }
</script>
</body>
</html>

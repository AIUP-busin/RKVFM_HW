<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Shaxsiy Byudjet Rejasi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; padding: 30px; background-color: #f4f7f6; }
        h2 { color: #333; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 15px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        .high-priority { color: #e74c3c; font-weight: bold; }
        .status-pending { background-color: #fff3cd; }
        .action-btn { background-color: #27ae60; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        .action-btn:hover { background-color: #219150; }
    </style>
</head>
<body>

<h2>1 Oylik Shaxsiy va Byudjet Rejasi</h2>

<table id="rejaTable">
    <thead>
        <tr>
            <th>Kun</th>
            <th>Vazifa</th>
            <th>Prioritet</th>
            <th>Byudjet (so'm)</th>
            <th>Natija</th>
            <th>Boshqaruv</th>
        </tr>
    </thead>
    <tbody>
        <tr id="row1">
            <td>12-Iyun</td>
            <td>Oylik daromad va xarajatni taqsimlash</td>
            <td class="high-priority">Yuqori</td>
            <td>0</td>
            <td>Reja tayyor</td>
            <td><button class="action-btn" onclick="tahrirlash('row1')">Surish</button></td>
        </tr>
        <tr id="row2">
            <td>13-Iyun</td>
            <td>O'quv kursi to'lovi</td>
            <td>O'rta</td>
            <td>-500,000</td>
            <td>To'landi</td>
            <td><button class="action-btn" onclick="tahrirlash('row2')">Surish</button></td>
        </tr>
    </tbody>
</table>

<script>
    function tahrirlash(rowId) {
        const row = document.getElementById(rowId);
        row.classList.add('status-pending');
        alert("DIQQAT: " + rowId + " kungi vazifa keyingi haftaga surildi!");
    }
</script>
</body>
</html>
